<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Feedback-biased CMOS inverter amplifier</title>
  <desc id="d">Input terminal, series coupling capacitor and input resistor into an inverter. A feedback resistor connects the inverter output back to its input node. The output terminal is taken from the inverter output.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- input terminal and coupling capacitor -->
    <circle cx="40" cy="150" r="5"/>
    <line x1="45" y1="150" x2="110" y2="150"/>
    <line x1="110" y1="132" x2="110" y2="168"/>
    <line x1="124" y1="132" x2="124" y2="168"/>
    <line x1="124" y1="150" x2="170" y2="150"/>
    <!-- input resistor -->
    <polyline points="170,150 180,150 185,138 195,162 205,138 215,162 225,138 230,150 240,150"/>
    <line x1="240" y1="150" x2="330" y2="150"/>
    <!-- inverter -->
    <polygon points="330,115 330,185 410,150"/>
    <circle cx="416" cy="150" r="6"/>
    <line x1="422" y1="150" x2="565" y2="150"/>
    <circle cx="570" cy="150" r="5"/>
    <!-- feedback path with resistor -->
    <polyline points="290,150 290,60 345,60"/>
    <polyline points="345,60 355,60 360,48 370,72 380,48 390,72 400,48 405,60 415,60"/>
    <polyline points="415,60 480,60 480,150"/>
  </g>
  <!-- junction dots -->
  <circle cx="290" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="480" cy="150" r="4" fill="#1a1a1a"/>
  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="30" y="182" font-size="18">V</text><text x="42" y="186" font-size="12">in</text>
    <text x="559" y="182" font-size="18">V</text><text x="571" y="186" font-size="12">out</text>
    <text x="106" y="118" font-size="18">C</text><text x="119" y="122" font-size="12">c</text>
    <text x="190" y="124" font-size="18">R</text><text x="203" y="128" font-size="12">in</text>
    <text x="368" y="36" font-size="18">R</text><text x="381" y="40" font-size="12">f</text>
    <text x="345" y="155" font-size="13">inv</text>
  </g>
  <text x="320" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle">Rf self-biases the inverter near mid-supply; gain is about Rf / Rin. Supply pins not shown.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
